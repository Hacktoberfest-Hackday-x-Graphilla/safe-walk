<div class="container">

    <!-- LOGO -->

    <div class="logo">
        🛡️
    </div>

    <h1>SafeWalk</h1>

    <p class="subtitle">
        Your personal walking safety assistant
    </p>


    <!-- =========================
         EMERGENCY CONTACTS
    ========================== -->

    <div class="card">

        <h2>👥 Emergency Contacts</h2>

        <p class="small-text">
            Select the people who should receive your alert.
        </p>

        <div id="contacts">

            <div class="contact">

                <input
                    type="checkbox"
                    checked
                >

                <input
                    type="text"
                    class="contact-name"
                    value="Mom"
                    placeholder="Name"
                >

                <input
                    type="tel"
                    class="contact-number"
                    placeholder="Phone number"
                >

            </div>

        </div>

        <button
            class="add-btn"
            onclick="addContact()"
        >
            + Add Contact
        </button>

    </div>


    <!-- =========================
         LOCATION
    ========================== -->

    <div class="card">

        <h2>📍 Your Location</h2>

        <p id="locationStatus">
            Location not detected
        </p>

        <button
            class="location-btn"
            onclick="getLocation()"
        >
            📍 Get My Location
        </button>

    </div>

         ALERT
    ========================== -->
