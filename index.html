<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SafeWalk</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header>
        <h1>SafeWalk</h1>
        <p>Your personal safety companion</p>
    </header>


    <!-- MAIN CONTENT -->
    <main>

        <!-- LOCATION SECTION -->
        <section class="card">

            <h2>📍 Your Location</h2>

            <p id="locationStatus">
                Location not detected
            </p>

            <button onclick="getLocation()">
                Detect My Location
            </button>

        </section>


        <!-- EMERGENCY CONTACTS -->
        <section class="card">

            <h2>👥 Emergency Contacts</h2>

            <div id="contacts">

                <!-- DEFAULT CONTACT -->
                <div class="contact">

                    <input
                        type="checkbox"
                        checked
                        aria-label="Select contact"
                    >

                    <input
                        type="text"
                        class="contact-name"
                        placeholder="Name"
                    >

                    <input
                        type="tel"
                        class="contact-number"
                        placeholder="+9779812345678"
                    >

                </div>

            </div>


            <button
                type="button"
                onclick="addContact()"
            >
                + Add Contact
            </button>

        </section>


        <!-- ALERT SECTION -->
        <section class="card alert-card">

            <h2>🚨 Emergency Alert</h2>

            <p>
                Press the button below if you need to send
                your current location to your emergency contact.
            </p>


            <!-- START ALERT -->
            <button
                type="button"
                class="alert-button"
                onclick="startAlert()"
            >
                🚨 Send Emergency Alert
            </button>


            <!-- COUNTDOWN -->
            <div
                id="countdownBox"
                class="hidden"
            >

                <h3>Alert will be sent in:</h3>

                <div id="countdown">
                    5
                </div>

                <button
                    type="button"
                    onclick="cancelAlert()"
                >
                    Cancel Alert
                </button>

            </div>


            <!-- STATUS -->
            <p id="status"></p>

        </section>

    </main>


    <!-- FOOTER -->
    <footer>
        <p>SafeWalk © 2026</p>
    </footer>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>
</html>
