<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>SafeWalk Alert</title>

<style>

    * {
        box-sizing: border-box;
    }

    body {

        margin: 0;

        font-family: Arial, sans-serif;

        background: #fff4f4;

        min-height: 100vh;

        display: flex;

        justify-content: center;

        align-items: center;

        padding: 20px;

    }

    .alert-container {

        width: 100%;

        max-width: 600px;

        background: white;

        padding: 35px;

        border-radius: 20px;

        text-align: center;

        box-shadow:
            0 10px 30px
            rgba(0, 0, 0, 0.15);

    }

    .icon {

        font-size: 70px;

    }

    h1 {

        color: #d32f2f;

        margin-bottom: 10px;

    }

    .message-box {

        background: #fff0f0;

        padding: 20px;

        border-radius: 15px;

        margin-top: 25px;

        text-align: left;

    }

    #message {

        white-space: pre-line;

        line-height: 1.7;

        word-break: break-word;

    }

    .location-box {

        background: #f0f7ff;

        padding: 20px;

        border-radius: 15px;

        margin-top: 20px;

        text-align: left;

    }

    #coordinates {

        line-height: 1.7;

    }

    .map-btn {

        display: block;

        background: #1976d2;

        color: white;

        text-decoration: none;

        padding: 14px;

        border-radius: 10px;

        text-align: center;

        margin-top: 15px;

        font-weight: bold;

    }

    .back-btn {

        margin-top: 25px;

        padding: 12px 25px;

        border: none;

        border-radius: 10px;

        background: #555;

        color: white;

        cursor: pointer;

        font-size: 16px;

    }

</style>
```

</head>

<body>

```
<div class="alert-container">

    <div class="icon">
        🚨
    </div>

    <h1>
        SAFEWALK ALERT
    </h1>

    <p>
        Emergency alert created.
    </p>


    <!-- MESSAGE -->

    <div class="message-box">

        <h2>
            📱 Message
        </h2>

        <p id="message">
            Loading...
        </p>

    </div>


    <!-- LOCATION -->

    <div class="location-box">

        <h2>
            📍 Present Location
        </h2>

        <p id="coordinates">
            Loading...
        </p>

        <a
            id="mapLink"
            class="map-btn"
            target="_blank"
            rel="noopener noreferrer">

            🗺️ Open My Location

        </a>

    </div>


    <button
        class="back-btn"
        onclick="goBack()">

        ← Back to SafeWalk

    </button>

</div>


<script>

    // Get saved information

    const message =
        localStorage.getItem(
            "safeWalkMessage"
        );

    const latitude =
        localStorage.getItem(
            "safeWalkLatitude"
        );

    const longitude =
        localStorage.getItem(
            "safeWalkLongitude"
        );

    const mapLink =
        localStorage.getItem(
            "safeWalkMapLink"
        );


    // Show message

    document.getElementById(
        "message"
    ).innerText =
        message || "No message found.";


    // Show coordinates

    document.getElementById(
        "coordinates"
    ).innerText =
        "Latitude: " +
        latitude +
        "\nLongitude: " +
        longitude;


    // Set Google Maps link

    document.getElementById(
        "mapLink"
    ).href =
        mapLink;


    // Back button

    function goBack() {

        window.location.href =
            "index.html";

    }

</script>
```

</body>

</html>
